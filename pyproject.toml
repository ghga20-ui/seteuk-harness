# 이 저장소는 pip 설치용 패키지가 아니라 폴더 복사로 배포되는 Claude Code 스킬이다.
# 따라서 [build-system]을 두지 않는다(빌드·패키징 대상 아님).
# 이 파일은 의존성 선언과 도구 설정만 담는다.
# 테스트 실행에 필요한 것은 `pip install pytest openpyxl` 뿐이다.

[project]
name = "seteuk-harness"
version = "0.1.0"
description = "수행평가 학생 원본으로 과세특 초안을 생성하는 자기 성장형 하네스 (Claude Code 스킬)"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
]

[project.optional-dependencies]
# Pillow는 손글씨 이미지 마스킹(mask_images.py)에만 필요하다 — 텍스트 경로만
# 쓰는 교사는 없어도 된다. 테스트는 손글씨 경로도 검증하므로 dev에 포함한다.
handwriting = [
    "Pillow",
]
dev = [
    "pytest",
    "Pillow",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests"]
