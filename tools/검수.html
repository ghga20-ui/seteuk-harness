<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세특 검수 — seteuk-harness</title>
<style>
  :root {
    --bg: #fbfbfa; --fg: #1a1a18; --muted: #6b6b64; --line: #e2e2dd;
    --card: #fff; --accent: #2f6f4e; --warn: #9a6b00; --bad: #a33a2a;
    --warnbg: #fdf6e3; --badbg: #fdeeeb; --okbg: #eef5f0; --src: #f4f4f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a; --fg: #e8e8e4; --muted: #9a9a92; --line: #2e3034;
      --card: #1e1f23; --accent: #7fb99a; --warn: #d8b25e; --bad: #e08b7a;
      --warnbg: #2a2418; --badbg: #2b1c19; --okbg: #1b241f; --src: #191a1e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 5rem; background: var(--bg); color: var(--fg);
    font: 16px/1.6 "Malgun Gothic", "맑은 고딕", -apple-system, system-ui, sans-serif;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 1.5rem 1.25rem; }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .sub { color: var(--muted); font-size: .88rem; margin: 0 0 1.5rem; }

  .bar {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: .7rem 1.25rem;
    display: flex; flex-wrap: wrap; gap: .6rem; align-items: center;
  }
  .bar .grow { flex: 1 1 auto; }
  .prog { font-size: .88rem; color: var(--muted); }
  .prog b { color: var(--fg); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 1.1rem; margin-bottom: 1rem;
  }
  .card.done { opacity: .55; }
  .card.flag { border-color: var(--warn); }

  .head { display: flex; flex-wrap: wrap; gap: .5rem; align-items: baseline; margin-bottom: .7rem; }
  .who { font-weight: 600; }
  .tag {
    font-size: .76rem; padding: .15rem .5rem; border-radius: 999px;
    background: var(--okbg); border: 1px solid var(--line); color: var(--muted);
  }
  .tag.flag { background: var(--warnbg); color: var(--warn); border-color: transparent; }
  .tag.ex   { background: var(--badbg); color: var(--bad); border-color: transparent; }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; }
  @media (max-width: 800px) { .split { grid-template-columns: 1fr; } }
  .pane h3 {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin: 0 0 .4rem; font-weight: 600;
  }
  .source {
    background: var(--src); border: 1px solid var(--line); border-radius: 7px;
    padding: .7rem; max-height: 260px; overflow-y: auto;
    font-size: .87rem; white-space: pre-wrap; word-break: break-word;
  }
  textarea {
    width: 100%; min-height: 190px; padding: .7rem; border: 1px solid var(--line);
    border-radius: 7px; background: var(--bg); color: var(--fg); resize: vertical;
    font: 15px/1.7 inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .meta { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: center;
          margin-top: .5rem; font-size: .85rem; color: var(--muted); }
  .meta .over { color: var(--bad); font-weight: 600; }
  .hits { color: var(--bad); }
  .memo {
    width: 100%; margin-top: .5rem; padding: .45rem .6rem; font: inherit; font-size: .87rem;
    border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--fg);
  }
  .foot { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin-top: .7rem; }
  label.chk { display: flex; gap: .4rem; align-items: center; font-size: .88rem; cursor: pointer; }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }

  button {
    font: inherit; font-size: .9rem; padding: .5rem 1rem; border-radius: 7px;
    border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=file] { font-size: .87rem; }
  .notice { padding: .7rem .85rem; border-radius: 7px; font-size: .9rem; margin: 0 0 1rem; }
  .notice.warn { background: var(--warnbg); color: var(--warn); }
  .privacy { font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line);
             padding-top: 1rem; margin-top: 2rem; }
  code { background: var(--src); padding: .1rem .35rem; border-radius: 4px; font-size: .88em; }
</style>
</head>
<body>

<div class="bar">
  <input type="file" id="load" accept=".json">
  <span class="grow"></span>
  <span class="prog" id="prog"></span>
  <button id="onlyflag">우선 검토만</button>
  <button class="primary" id="save" disabled>검수본 저장</button>
  <span class="prog" id="saved"></span>
</div>

<main>
  <h1>세특 검수</h1>
  <p class="sub">
    <code>검수번들.json</code>을 불러 원문과 세특을 나란히 보며 고칩니다.
    저장하면 <b>실명 검수본</b>(로컬 보관용)과 <b>토큰 diff</b>(AI에게 줄 것)가 함께 나옵니다.
  </p>
  <div id="head"></div>
  <div id="list"></div>
</main>

<p class="privacy" style="max-width:1180px;margin:2rem auto;padding:1rem 1.25rem 0">
  이 페이지는 서버가 없습니다. 불러온 명단·원문은 브라우저 밖으로 나가지 않습니다.
  <b>검수본.json에는 실명이 들어 있으므로 AI에게 주지 마십시오</b> — AI에게는 <code>검수diff.json</code>만 주면 됩니다.
  검수가 끝나면 <code>pseudonymize.py destroy --dir &lt;활동폴더&gt; --yes</code>로 중간 파일을 파기하세요.
</p>

<script>
"use strict";

const U8 = s => new TextEncoder().encode(s || "").length;
/** 엑셀 =(LENB-LEN)*2+LEN 과 같은 셈(한글 2바이트). 기준이 확정되면 하나로 줄인다. */
const B2 = s => [...(s || "")].reduce((n, c) => n + (c.codePointAt(0) > 127 ? 2 : 1), 0);
const esc = s => String(s == null ? "" : s)
  .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let data = null;         // 불러온 번들
let original = new Map(); // 토큰(없으면 학번) → 원래 세특·비고
let onlyFlag = false;

function keyOf(s) { return s.토큰 || `학번:${s.학번}`; }

/**
 * 금지 어휘와 금지 문자를 찾는다.
 * 금지문자패턴은 정규식이다 — 문자 목록처럼 부분일치로 검사하면 패턴 문자열
 * 자체가 본문에 나올 리 없어 아무것도 잡지 못한다(실제로 그렇게 새어 있었다).
 */
function bannedHits(text) {
  const hits = [];
  for (const w of (data.금지어 || [])) if (w && text.includes(w)) hits.push(w);
  const pat = data.금지문자패턴;
  if (pat) {
    try {
      const found = text.match(new RegExp(pat, "gu")) || [];
      for (const c of new Set(found)) hits.push(c);
    } catch (err) {
      // 패턴이 깨져 있으면 조용히 넘기지 않고 화면에 알린다
      hits.push(`(금지문자 패턴 오류: ${err.message})`);
    }
  }
  return hits;
}

function load(json) {
  data = json;
  original = new Map();
  (data.students || []).forEach(s => {
    original.set(keyOf(s), { 세특: s.세특 || "", 비고: s.비고 || "" });
    s.검수완료 = false;
    s.검수메모 = "";
  });
  // 우선 검토 대상을 위로 — 균등 검토는 균등하게 대충 보는 검토가 되기 쉽다.
  data.students.sort((a, b) => (b.우선검토?.length || 0) - (a.우선검토?.length || 0));
  document.getElementById("save").disabled = false;
  renderHead();
  render();
}

function renderHead() {
  const flagged = data.students.filter(s => s.우선검토?.length).length;
  document.getElementById("head").innerHTML = data.활동명
    ? `<div class="notice warn">${esc(data.활동명)} · 총 ${data.students.length}명 중 우선 검토 <b>${flagged}명</b>.
       목표 ${data.목표바이트 ?? "?"} / 상한 ${data.상한바이트 ?? "?"} 바이트.
       바이트는 UTF-8과 2바이트 기준을 함께 보여 줍니다(기준 확정 전).</div>`
    : "";
}

function render() {
  const list = document.getElementById("list");
  const shown = data.students.filter(s => !onlyFlag || s.우선검토?.length);
  list.innerHTML = shown.map((s, i) => {
    const idx = data.students.indexOf(s);
    const tags = [
      s.반 ? `<span class="tag">${esc(s.반)}</span>` : "",
      s.톤등급 ? `<span class="tag">톤 ${esc(s.톤등급)}</span>` : "",
      s.예외 ? `<span class="tag ex">예외</span>` : "",
      ...(s.우선검토 || []).map(r => `<span class="tag flag">${esc(r)}</span>`),
    ].join("");
    return `
    <div class="card ${s.우선검토?.length ? "flag" : ""} ${s.검수완료 ? "done" : ""}" data-i="${idx}">
      <div class="head">
        <span class="who">${esc(s.학번)} ${esc(s.이름)}</span>
        ${s.핵심소재 ? `<span class="tag">${esc(s.핵심소재)}</span>` : ""}
        ${tags}
      </div>
      <div class="split">
        <div class="pane">
          <h3>학생 원문</h3>
          <div class="source">${esc(s.원문) || '<span style="opacity:.5">원문 없음</span>'}</div>
        </div>
        <div class="pane">
          <h3>세특 (고치면 즉시 반영)</h3>
          <textarea data-i="${idx}">${esc(s.세특)}</textarea>
          <div class="meta" id="m${idx}"></div>
          <input class="memo" data-i="${idx}" placeholder="검수 메모 — 왜 고쳤는지 적으면 다음 회차 규칙에 반영됩니다">
        </div>
      </div>
      <div class="foot">
        <label class="chk"><input type="checkbox" data-i="${idx}" ${s.검수완료 ? "checked" : ""}> 검수 완료</label>
        ${s.비고 ? `<span class="prog">비고: ${esc(s.비고)}</span>` : ""}
      </div>
    </div>`;
  }).join("");
  shown.forEach(s => meta(data.students.indexOf(s)));
  progress();
}

function meta(i) {
  const s = data.students[i];
  const el = document.getElementById("m" + i);
  if (!el) return;
  const u = U8(s.세특), b = B2(s.세특);
  const over = data.상한바이트 && u > data.상한바이트;
  const hits = bannedHits(s.세특);
  const changed = original.get(keyOf(s))?.세특 !== s.세특;
  el.innerHTML =
    `<span class="${over ? "over" : ""}">${u} 바이트(UTF-8)</span>` +
    `<span>${b} (2바이트 기준)</span>` +
    (over ? `<span class="over">상한 ${data.상한바이트} 초과</span>` : "") +
    (hits.length ? `<span class="hits">금지: ${hits.map(esc).join(", ")}</span>` : "") +
    (changed ? `<span>수정됨</span>` : "");
}

function progress() {
  const done = data.students.filter(s => s.검수완료).length;
  const changed = data.students.filter(s => original.get(keyOf(s))?.세특 !== s.세특).length;
  document.getElementById("prog").innerHTML =
    `검수 <b>${done}</b>/${data.students.length} · 수정 <b>${changed}</b>건`;
}

document.getElementById("load").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    load(JSON.parse(await f.text()));
  } catch (err) {
    alert("검수번들.json을 읽지 못했습니다: " + err.message);
  }
});

document.getElementById("list").addEventListener("input", e => {
  const i = e.target.dataset.i;
  if (i === undefined) return;
  const s = data.students[i];
  if (e.target.tagName === "TEXTAREA") { s.세특 = e.target.value; meta(i); progress(); }
  else if (e.target.classList.contains("memo")) { s.검수메모 = e.target.value; }
});

document.getElementById("list").addEventListener("change", e => {
  const i = e.target.dataset.i;
  if (i === undefined || e.target.type !== "checkbox") return;
  data.students[i].검수완료 = e.target.checked;
  e.target.closest(".card").classList.toggle("done", e.target.checked);
  progress();
});

document.getElementById("onlyflag").addEventListener("click", () => {
  onlyFlag = !onlyFlag;
  document.getElementById("onlyflag").textContent = onlyFlag ? "전체 보기" : "우선 검토만";
  render();
});

async function saveFile(name, obj) {
  const text = JSON.stringify(obj, null, 1);
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      });
      const w = await h.createWritable();
      await w.write(text); await w.close();
      return "선택한 위치";
    } catch (err) {
      if (err && err.name === "AbortError") return null;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
  a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  return "내려받기 폴더";
}

/**
 * 저장할 두 파일을 만든다.
 * 검수본 — 실명 포함, 초안.json과 같은 계약이라 verify_seteuk --save가 그대로 받는다.
 * diff  — 토큰 기준. 실명·학번이 들어가지 않으며 AI는 이것만 읽는다.
 */
function buildOutputs() {
  const byClass = new Map();
  for (const s of data.students) {
    const name = s.반 || "1반";
    if (!byClass.has(name)) byClass.set(name, []);
    byClass.get(name).push({
      학번: s.학번, 이름: s.이름, 핵심소재: s.핵심소재 || "",
      톤등급: s.톤등급 || "", 세특: s.세특 || "",
      비고: s.비고 || "", 예외: !!s.예외,
    });
  }
  const 검수본 = { classes: [...byClass].map(([name, students]) => ({ name, students })) };

  const 변경 = [];
  for (const s of data.students) {
    const o = original.get(keyOf(s)) || { 세특: "", 비고: "" };
    if (o.세특 === s.세특 && !s.검수메모) continue;
    변경.push({
      토큰: s.토큰 || null,
      톤등급: s.톤등급 || "",
      예외: !!s.예외,
      전: o.세특,
      후: s.세특,
      검수메모: s.검수메모 || "",
      바이트변화: { 전: U8(o.세특), 후: U8(s.세특) },
    });
  }
  const diff = {
    활동명: data.활동명 || "",
    총원: data.students.length,
    검수완료: data.students.filter(s => s.검수완료).length,
    수정: 변경.length,
    변경,
  };
  return { 검수본, diff };
}

document.getElementById("save").addEventListener("click", async () => {
  const notDone = data.students.filter(s => !s.검수완료).length;
  if (notDone && !confirm(`검수 완료 표시가 없는 학생이 ${notDone}명 있습니다. 그래도 저장할까요?`)) return;

  const { 검수본, diff } = buildOutputs();
  const 변경 = diff.변경;

  const btn = document.getElementById("save");
  btn.disabled = true;
  let where = null;
  try {
    where = await saveFile("검수본.json", 검수본);
    if (where === null) { document.getElementById("saved").textContent = "저장 취소"; return; }
    const w2 = await saveFile("검수diff.json", diff);
    if (w2 === null) { document.getElementById("saved").textContent = "diff 저장 취소"; return; }
  } finally { btn.disabled = false; }

  document.getElementById("saved").textContent =
    `저장함(${where}) — 수정 ${변경.length}건. AI에게는 검수diff.json만 주세요.`;
});

window.addEventListener("beforeunload", e => {
  if (!data) return;
  const changed = data.students.some(s => original.get(keyOf(s))?.세특 !== s.세특);
  if (changed) { e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
</html>
