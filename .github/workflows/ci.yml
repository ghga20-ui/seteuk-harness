name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: python -m pip install pytest openpyxl Pillow

      - name: Byte-compile scripts
        run: python -m compileall scripts

      - name: Run Python tests
        run: python -m pytest scripts/tests -q

      - name: Run Node tests
        # 하네스(reporter)는 실패가 있으면 process.exit(1)로 비0 종료한다(로컬 검증 완료).
        # 파일별로 실행해 하나라도 비0이면 스텝을 실패시킨다.
        run: |
          fail=0
          for f in tools/tests/test_*.mjs; do
            echo "=== $f ==="
            if ! node "$f"; then
              echo "FAILED: $f"
              fail=1
            fi
          done
          exit "$fail"
